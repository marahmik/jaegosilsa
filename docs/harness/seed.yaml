version: 8
status: approved
task_id: "20261007-182420-7f6d"
goal: "여러 사용자가 각자의 PC 브라우저에서 고정 POS 엑셀을 불러와 제품 정보를 정리하고, 실물 바코드 스캔으로 수량을 집계하여 현매장 재고와의 부족·초과 및 원본 음수·양수 재고를 구분하고 결과를 엑셀로 내려받을 수 있는 간단한 재고실사 사이트를 만든다."
constraints:
  - "로그인 없이 사용하며 원본 엑셀과 실사 정보는 브라우저에서 처리·저장한다. 외부 서버로 제품 데이터를 전송하지 않는다."
  - "기준 수량은 현매장 재고 한 열이다. 창고 및 타 매장 열을 합산하지 않는다."
  - "바코드는 숫자로 변환하거나 대소문자를 변경하지 않는다. 스캐너 종료 신호·입력란 외곽 공백만 입력 경계에서 처리한다."
  - "원본 상품명·옵션명을 보존하며 규칙 밖 제품의 품번·색상 및 사이즈를 추측하지 않는다."
  - "공동 실사·자동 동기화·외부 사이트 원본 수정은 하지 않는다."
  - "샘플 원본은 사용자 Downloads 경로에서 읽기만 하고 저장소에 복사하거나 커밋하지 않는다."
  - "기존 Windows 하네스 실패를 앱 검증 성공으로 대체하지 않는다. 앱 자체의 검증과 실제 브라우저·장비 검증을 수행한다."
acceptance_criteria:
  - "AC1: 제공 샘플의 Sheet1에서 상품명·옵션명·바코드 번호·현매장 재고 헤더로 62,080개 제품을 읽고, 빈 이미지 셀이나 다른 매장 열 때문에 필드가 밀리지 않는다. 바코드는 문자열로, 기준 수량은 부호 있는 정수로 보존하며 창고 수량은 합산하지 않는다. 검증용 입력에서 현매장 2·창고 7·타 매장 11일 때 기준은 2여야 한다."
  - "AC2: 상품명 XUL4PT1301 핑크스완과 옵션명 120은 품번 XUL4PT1301·색상 핑크스완·옵션/사이즈 120으로 표시한다. 짧은 품번 X1SHU도 지원한다. 상품명 외곽 공백을 제거한 뒤 ^([A-Z][A-Z0-9]*[0-9][A-Z0-9]*)\\s+(.+)$로 품번·색상을 분리하며 원문 상품명도 보존한다."
  - "AC3: 분리 규칙에 맞지 않는 샘플 1,249행은 버리지 않고 원문 상품명·옵션명·바코드를 보존한다. 품번·색상을 추측하지 않고 확인 필요로 표시한다. 옵션명 블랙도 그대로 표시하며 바코드 F에서 FREE를 임의 추론하지 않는다."
  - "AC4: 기준 재고가 0인 제품도 바코드 매칭 대상이다. XUL4PT130121120을 3회 등록하면 해당 제품 실물 수량만 3이 된다. 1회 취소 또는 수량 2로 수정 시 수량과 차이가 함께 갱신된다. 실물 수량은 음수가 될 수 없다."
  - "AC5: 제품별 차이는 실물−현매장 재고이다. 기준 10·실물 8은 −2, 기준 10·실물 12는 +2, 기준 −2·실물 0은 +2이다. 원본 기준 재고의 음수·양수·0과 실사 부족·초과·일치를 서로 구분해서 확인할 수 있다."
  - "AC6: 미등록 바코드 입력 시 화면 경고와 오류라는 한국어 음성을 출력하고 어떤 제품 수량도 증가시키지 않습니다. 음성 청취는 사용자의 재생 확인으로 수락하며, 물리 스캐너 테스트는 미보유에 따른 사용자 승인으로 이번 작업에서 제외합니다."
  - "AC7: 바코드의 영문·숫자·앞자리 0을 보존해 직접 매칭한다. 비어 있는 필수 값, 정수가 아닌 수량, 중복 바코드 또는 충돌 제품은 원본 행과 원인을 표시하며 임의 매칭하지 않는다. 잘못된 파일 입력 또는 교체 취소 시 기존 실사 기록을 보존한다."
  - "AC8: 같은 브라우저에서 새로고침 후 제품·기준 수량·실물 수량·선택 파일 정보가 복원된다. 새 엑셀로 실사를 교체할 때 기존 기록 변경을 확인받고 실물 수량은 새 실사 기준으로 초기화한다. 다른 브라우저·PC와 자동 공유하지 않는다."
  - "AC9: 품번·색상·옵션/사이즈·원문 상품명·바코드·기준 수량·실물 수량·차이·확인 필요 상태를 화면과 XLSX 결과에 보존한다. 내려받은 파일을 다시 읽었을 때 바코드 문자열과 제품별 수량·차이가 화면과 일치한다."
  - "AC10: 등록된 바코드의 스캔 집계가 브라우저 저장까지 성공한 뒤에만 짧은 성공 비프음을 한 번 출력합니다. 미등록·빈 입력·저장 실패·수량 수정·취소에는 성공음을 출력하지 않으며 기존 오류 음성은 유지합니다. 브라우저 오디오가 미지원·차단·실패하면 해당 상태를 화면에 표시하되 저장 완료된 재고를 실패로 되돌리지 않습니다."
  - "AC11: Vercel 로컬 설정 .vercel 및 .env*는 git check-ignore로 제외됨을 확인하고, 인증 관련 파일·원본 XLSX·로컬 아카이브가 Git 추적 대상에 포함되지 않습니다."
  - "AC12: 한국어·영어 README와 검증 보고서는 실제 production URL, 비업무용 Hobby 사용, 수동 prebuilt 배포, 자동 Git 배포 비활성화 및 origin별 기록 분리 안내를 일치시킵니다."
  - "AC13: 배포 기록 보관 변경은 문서·ignore 설정과 필요한 작업 추적 기록으로 한정하며 앱 소스·하네스 코드·배포 설정을 변경하거나 사이트를 재배포하지 않습니다. 새 비프음 사람 청취와 물리 스캐너 미검증 범위를 유지합니다."
  - "AC14: 다운로드 버튼 왼쪽의 전체 리셋 버튼은 기존 디자인 스타일을 재사용하며 삭제 확인을 거칩니다. 확인 취소 시 현재 제품·파일 정보·스캔 및 수정 수량을 유지합니다. 비어 있는 정상 상태 및 가져오기·내보내기·복원·리셋 처리 중에는 실행되지 않습니다."
  - "AC15: 리셋 승인은 현재 origin의 IndexedDB 파일 정보·제품 목록·실물 수량을 하나의 트랜잭션으로 삭제합니다. 트랜잭션 완료 이후에만 메모리·최근 스캔·검색/필터·입력·표·요약을 빈 초기 상태로 바꾸며 새로고침에도 복원되지 않습니다. PC의 원본 엑셀 및 다른 앱·origin의 저장 데이터는 삭제하지 않습니다."
  - "AC16: 리셋 트랜잭션 실패·취소는 기존 저장 기록과 화면을 유지하고 명확한 오류를 표시합니다. 저장 대기 중 클릭하면 기존 스캔/수정 쓰기를 기다려 완료한 뒤 삭제하며, 그 사이 새 쓰기·중복 리셋·파일 교체를 막아 삭제 뒤 수량이 되살아나지 않습니다."
  - "AC17: 정상 리셋 이후 같은 이름의 엑셀을 다시 가져와 실물 0부터 새 실사를 시작할 수 있습니다. 파일·필터·확인 필요·최근 스캔·취소 이력은 이전 실사 상태를 남기지 않습니다. 손상된 기존 기록의 복원 실패 상태에서도 확인 후 지원되는 저장소의 기록을 초기화할 수 있습니다."
out_of_scope:
  - "로그인·계정 및 서버 데이터 저장"
  - "다른 PC·브라우저 간 동기화 및 여러 사람의 공동 실사"
  - "휴대폰 카메라 스캔"
  - "외부 사이트 재고 자동 수정 또는 외부 사이트 업로드 전용 양식"
  - "다른 사이트 엑셀 양식 및 XLS·CSV 파일 지원"
  - "미등록 바코드 별도 제품 집계 및 품번·색상 추측 생성"
  - "물리 스캐너 실기 테스트: 장비 미보유에 따라 사용자가 이번 작업에서 제외하도록 승인했습니다. 키보드형 입력 지원 기능은 유지하며 물리 장비 호환성을 검증했다고 주장하지 않습니다."
assumptions:
  - "사용자가 고정 양식이라고 확인한 POS XLSX의 Sheet1과 헤더 구조가 다음 다운로드에도 유지된다."
  - "실물 PC 스캐너는 키보드형이며 Excel 바코드 값을 입력한다고 전제합니다. 사용자가 장비 미보유로 이번 실기 테스트 생략을 승인했으며, 실제 장비 호환성은 아직 검증하지 않았습니다."
  - "최초 킥오프에는 앱 스택과 명령이 미정이었습니다. 현재 정적 앱은 Vite·TypeScript로 구현되어 있고 실제 패키지·실행·검증 명령은 package.json과 verification-report.md에 기록되어 있습니다."
risks:
  - "브라우저 저장소 삭제·용량 제한·저장 실패 및 다른 origin에서의 기록 격리. 저장 실패는 사용자에게 표시하고 저장됐다고 허위 보고하지 않는다."
  - "62,080개 제품을 다루므로 가져오기·표 표시·수량 갱신·저장에서 메인 스레드 정체와 데이터 손실을 점검해야 한다."
  - "물리 스캐너의 실제 바코드 값과 Enter/Tab 종료 신호는 검증하지 않았습니다. 이번 테스트 제외는 사용자 승인에 따른 범위 결정이며, 장비 확보 후 별도 호환성 확인이 필요합니다."
  - "사용자가 현재 환경의 음성 재생을 확인했습니다. 다른 PC·브라우저의 한국어 음성 가용성이나 오디오 차단까지 보장하지 않으며 실패 상태는 화면에 표시해야 합니다."
  - "샘플 바코드는 모두 문자열이지만 다른 파일의 숫자 셀에서 이미 유실된 앞자리 0은 복원 근거 없이 추측할 수 없다."
  - "음수 기준 수량은 실물 0에서도 양수 차이를 만든다. 원본 재고 부호와 실사 차이 부호를 혼동하지 않아야 한다."
  - "원본 POS 데이터와 브라우저 입력은 신뢰하지 않는다. 상품명 출력과 XLSX 내보내기에서 HTML 실행·수식으로의 해석을 피한다."
  - "하네스 2026.87 Windows 검사에서 29건 실패했고 FIFO probe로 테스트 파일 3개가 초기화 중단됐습니다. upstream #98에 보고했으며 앱 검증과 독립적인 제약입니다. 초기화 중단으로 검사 범위가 달라 이전 149건과 단순 비교하지 않습니다."
